[package]
name = "webdiag"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Quena analyzer: diagnoses a capture and reports findings with evidence (performance, errors, authentication, network sensitivity)"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true
