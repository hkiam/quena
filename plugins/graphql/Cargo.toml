[package]
name = "graphql"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Quena decoder plugin: GraphQL requests and responses as formatted text"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true
