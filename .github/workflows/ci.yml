name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the runners' preinstalled 1.98.1 cannot link wasm32 components on
  # macOS (rust-lld: libLLVM.dylib not found). Keep in sync with local stable.
  RUST_TOOLCHAIN: "1.96.0"
  QUENA_WASM_TOOLCHAIN: "1.96.0"
  # Debug-build perf guards run on slow shared VMs: widen their time thresholds.
  QUENA_PERF_SLACK: "3"
  # Full optimization (LTO, one codegen unit) only for release tags; pushes build test
  # installers with the faster `ci` profile.
  BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Apple Silicon and Intel Macs.
          - os: macos-latest
            platform: macos-universal
            rust-targets: wasm32-wasip2,aarch64-apple-darwin,x86_64-apple-darwin
            # The SBOM covers both halves of the universal app (empty: the host target).
            sbom-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            out: target/universal-apple-darwin
          - os: windows-latest
            platform: windows-x64
            rust-targets: wasm32-wasip2
            out: target
          # Linux builds on the oldest supported Ubuntu so the .deb/AppImage run on older glibc.
          - os: ubuntu-22.04
            platform: linux-x64
            rust-targets: wasm32-wasip2
            out: target
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            rust-targets: wasm32-wasip2
            out: target
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm \
            libnss3-tools libsecret-tools libgssapi-krb5-2 dbus dbus-x11 gsettings-desktop-schemas dconf-cli
      - name: Windows Defender exclusions (build dirs)
        if: runner.os == 'Windows'
        shell: pwsh
        # Real-time scanning of every object file and rlib slows Rust builds considerably.
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:RUNNER_TEMP"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per build profile: tag builds (release) and pushes (ci) compile the
          # dependencies differently, and the cache is only saved when its key is new.
          key: ${{ env.BUILD_PROFILE }}
          cache-on-failure: true
          workspaces: |
            .
            plugins/fast-infoset
            plugins/rot13-test
            plugins/evil-test
            plugins/jwt
            plugins/graphql
            plugins/webdiag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Version consistency
        shell: bash
        run: |
          tools/release/version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          fi

      - name: UI dependencies
        run: npm ci --prefix app/ui
      - name: UI typecheck + build
        run: npm run build --prefix app/ui
      - name: UI tests
        run: npm test --prefix app/ui
      - name: Plugins
        shell: bash
        run: ./plugins/build.sh
      - name: Plugin tests
        shell: bash
        run: |
          for p in auth-tokens jwt graphql webdiag; do cargo test --manifest-path plugins/$p/Cargo.toml; done
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      # CycloneDX SBOMs of the app and of quena-cli for this platform (target/sbom/), shipped
      # in the bundles, the quena-cli archive and as release assets.
      - name: SBOM
        shell: bash
        run: tools/sbom/generate.sh "${{ matrix.platform }}" ${{ matrix.sbom-targets }}
      - name: SBOM schema check
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cyclonedx" \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  $RUNNER_TEMP/cyclonedx" | sha256sum -c
          chmod +x "$RUNNER_TEMP/cyclonedx"
          for f in target/sbom/*.cdx.json; do
            "$RUNNER_TEMP/cyclonedx" validate --input-file "$f" --input-format json --input-version v1_5 --fail-on-errors
          done
      - name: Rust tests
        run: cargo test --workspace --exclude quena-app --no-fail-fast
      - name: Command line (quena-cli archive)
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          if [ "${{ runner.os }}" = macOS ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do cargo build -p quena-cli --profile "$BUILD_PROFILE" --target $t; done
            mkdir -p target/cli
            lipo -create -output target/cli/quena-cli target/aarch64-apple-darwin/$BUILD_PROFILE/quena-cli target/x86_64-apple-darwin/$BUILD_PROFILE/quena-cli
            bin=target/cli/quena-cli
          else
            cargo build -p quena-cli --profile "$BUILD_PROFILE"
            bin=target/$BUILD_PROFILE/quena-cli; [ "${{ runner.os }}" = Windows ] && bin=$bin.exe
          fi
          dir=$(SBOM="$(ls target/sbom/quena-cli-*-"$platform".cdx.json)" tools/cli/stage.sh "$bin" "$platform")
          # Smoke test of the packaged program, copied out of the checkout so that it can only
          # use its own plugins folder: --help/--version, a report, the exit codes of the gate.
          smoke="$(cd "$RUNNER_TEMP" && pwd)/cli-smoke"; rm -rf "$smoke"; mkdir -p "$smoke"
          cp -R "$dir" "$smoke/"
          exe="$smoke/$(basename "$dir")/$(basename "$bin")"
          har="$PWD/app/e2e/fixtures/two-sessions.har"
          (
            cd "$smoke"
            unset QUENA_PLUGIN_DIR
            "$exe" --version
            "$exe" --help > /dev/null
            if [ "${{ runner.os }}" = macOS ]; then
              lipo -archs "$exe"
              if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "$exe" --version
              else echo "::notice::Rosetta not available: x86_64 slice of quena-cli not run"; fi
            fi
            "$exe" diagnose "$har" --fail-on none -o json=r.json --format md
            "$exe" compare r.json r.json --fail-on warning --quiet
            set +e; "$exe" diagnose "$har" --fail-on warning --format none --quiet; rc=$?; set -e
            [ "$rc" = 1 ] || { echo "expected exit code 1 (gate failed), got $rc"; exit 1; }
            set +e; "$exe" diagnose no-such-file.har --quiet; rc=$?; set -e
            [ "$rc" = 2 ] || { echo "expected exit code 2, got $rc"; exit 1; }
          )
          cd "$(dirname "$dir")"
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$(basename "$dir")' -DestinationPath '$(basename "$dir").zip' -Force"
          else
            tar -czf "$(basename "$dir").tar.gz" "$(basename "$dir")"
          fi
      - name: Linux desktop integration (GNOME proxy settings, NSS trust)
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test -p quena-platform -- --ignored

      # Platform-independent checks: run once.
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: 21
      - name: Fast Infoset interop (Java reference)
        if: runner.os == 'macOS'
        shell: bash
        run: ./plugins/fast-infoset/interop/run.sh
      - name: License check
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      - name: Bundle
        env:
          # AppImage tools run without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          args=()
          [ -n "${{ matrix.tauri-target }}" ] && args+=(--target "${{ matrix.tauri-target }}")
          # The SBOM goes into the bundle's resources only here: tauri.conf.json cannot name a
          # file that local builds (tauri dev) do not have. --config is merged into it.
          sbom=$(ls target/sbom/quena-[0-9]*-"${{ matrix.platform }}".cdx.json)
          echo "{\"bundle\":{\"resources\":{\"../../$sbom\":\"sbom.cdx.json\"}}}" > "$RUNNER_TEMP/sbom.conf.json"
          args+=(--config "$RUNNER_TEMP/sbom.conf.json")
          if [ "$BUILD_PROFILE" = release ]; then
            npm exec --prefix app/ui -- tauri build "${args[@]}"
          else
            npm exec --prefix app/ui -- tauri build "${args[@]}" -- --profile "$BUILD_PROFILE"
          fi
          bundle="${{ matrix.out }}/$BUILD_PROFILE/bundle"
          case "${{ runner.os }}" in
            macOS) test -s "$bundle/macos/Quena.app/Contents/Resources/sbom.cdx.json" ;;
            Linux) dpkg-deb -c "$bundle"/deb/*.deb | grep '/sbom\.cdx\.json$' ;;
          esac || { echo "the SBOM is missing from the bundle" >&2; exit 1; }
      - name: UI end-to-end tests (real app via WebDriver)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- app/e2e/run.sh "${{ matrix.out }}/$BUILD_PROFILE/quena"
      # The Windows e2e tests run in their own job on windows-2022 (see e2e-windows): on the
      # windows-2025 image WebView2 never opens its DevTools port under WebDriver
      # (actions/runner-images#14738). They test exactly this build.
      - name: Upload the app for the Windows UI tests
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-app
          retention-days: 3
          if-no-files-found: error
          path: |
            target/${{ env.BUILD_PROFILE }}/quena.exe
            plugins/dist/
      - name: Portable ZIP (Windows, xcopy deployment)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $out = "target/$env:BUILD_PROFILE/bundle/portable"
          $dir = "$out/Quena"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/$env:BUILD_PROFILE/quena.exe" "$dir/Quena.exe"
          # Same resources as the installers (bundled plugins).
          foreach ($r in $conf.bundle.resources.PSObject.Properties) {
            $src = Join-Path app/src-tauri $r.Name
            $dst = Join-Path $dir $r.Value
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            Copy-Item -Recurse $src $dst
          }
          New-Item -ItemType File "$dir/portable" | Out-Null
          Copy-Item app/src-tauri/windows/PORTABLE.txt "$dir/README-portable.txt"
          Copy-Item LICENSE, NOTICE $dir
          Copy-Item (Get-Item "target/sbom/quena-[0-9]*-windows-x64.cdx.json") "$dir/sbom.cdx.json"
          Compress-Archive -Path $dir -DestinationPath "$out/Quena_$($conf.version)_x64-portable.zip" -Force
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: quena-${{ runner.os }}-${{ matrix.tauri-target && 'universal' || runner.arch }}
          if-no-files-found: error
          path: |
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/dmg/*.dmg
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/nsis/*.exe
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/msi/*.msi
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/portable/*.zip
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/deb/*.deb
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/rpm/*.rpm
            ${{ matrix.out }}/${{ env.BUILD_PROFILE }}/bundle/appimage/*.AppImage
            target/cli/quena-cli-*.tar.gz
            target/cli/quena-cli-*.zip
            target/sbom/*.cdx.json

  e2e-windows:
    name: UI end-to-end tests (Windows, WebView2)
    needs: build
    # Not windows-latest: see the upload step in the build job.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same paths as in the build job: the dev-build fallback finds plugins/dist next to the
      # checkout the binary was built from (identical on both runners).
      - uses: actions/download-artifact@v4
        with:
          name: e2e-windows-app
          path: .
      - name: Run the UI tests (tauri-driver + Edge WebDriver)
        shell: bash
        run: |
          cargo install tauri-driver --locked
          # Edge WebDriver in the version of the installed WebView2 runtime.
          ver=$(pwsh -NoProfile -Command "(Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv")
          echo "WebView2 $ver"
          curl -fsSL --retry 3 -o edgedriver.zip "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip"
          unzip -q -o edgedriver.zip -d "$RUNNER_TEMP/edgedriver"
          EDGEDRIVER="$RUNNER_TEMP/edgedriver/msedgedriver.exe" app/e2e/run.sh "target/$BUILD_PROFILE/quena.exe"

  cli-action:
    name: GitHub Action (diagnose)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quena-Linux-X64
          path: dist
      - name: Unpack quena-cli
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "$(find dist -name 'quena-cli-*-linux-x64.tar.gz')" -C "$RUNNER_TEMP/cli"
          echo "QUENA_CLI=$(find "$RUNNER_TEMP/cli" -name quena-cli -type f)" >> "$GITHUB_ENV"
      - id: gate
        uses: ./diagnose
        with:
          files: app/e2e/fixtures/two-sessions.har
          fail-on: none
          bin: ${{ env.QUENA_CLI }}
      - name: Outputs of the action
        run: |
          test "${{ steps.gate.outputs.passed }}" = true
          test -s "${{ steps.gate.outputs.report }}"
          test -s "${{ steps.gate.outputs.junit }}"
          test -s "${{ steps.gate.outputs.markdown }}"
      # two-sessions.har has a warning (AUTH-FAIL, 403): the gate fails, and the action still
      # sets its outputs and writes the reports.
      - id: failing
        uses: ./diagnose
        continue-on-error: true
        with:
          files: app/e2e/fixtures/two-sessions.har
          fail-on: warning
          bin: ${{ env.QUENA_CLI }}
          summary: "false"
      - name: Outputs of the failing gate
        run: |
          test "${{ steps.failing.outcome }}" = failure
          test "${{ steps.failing.outputs.passed }}" = false
          test -s "${{ steps.failing.outputs.report }}"
          test -s "${{ steps.failing.outputs.junit }}"
          test -s "${{ steps.failing.outputs.markdown }}"
          grep -q '<failure' "${{ steps.failing.outputs.junit }}"

  release:
    name: draft release
    needs: [build, e2e-windows, cli-action]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the installers: the e2e-windows-app artifact (test binary + plugins) is no release asset.
      - uses: actions/download-artifact@v4
        with:
          pattern: quena-*
          path: dist
      # The GitHub Action (diagnose@vX.Y.Z, version: latest) and the Docker image only see the
      # release once it is published: drafts are invisible to them.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "Quena $GITHUB_REF_NAME" --notes "$notes" $(find dist -type f)
