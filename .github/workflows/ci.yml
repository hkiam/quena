name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the runners' preinstalled 1.98.1 cannot link wasm32 components on
  # macOS (rust-lld: libLLVM.dylib not found). Keep in sync with local stable.
  RUST_TOOLCHAIN: "1.96.0"
  PIPER_WASM_TOOLCHAIN: "1.96.0"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/fast-infoset
            plugins/rot13-test
            plugins/evil-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Version consistency
        shell: bash
        run: |
          tools/release/version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          fi

      - name: UI dependencies
        run: npm ci --prefix app/ui
      - name: UI typecheck + build
        run: npm run build --prefix app/ui
      - name: Plugins
        shell: bash
        run: ./plugins/build.sh
      - name: Rust tests
        run: cargo test --workspace --exclude piper-app --no-fail-fast

      # Platform-independent checks: run once.
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: 21
      - name: Fast Infoset interop (Java reference)
        if: runner.os == 'macOS'
        shell: bash
        run: ./plugins/fast-infoset/interop/run.sh
      - name: License check
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      - name: Bundle
        run: npm exec --prefix app/ui -- tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: piper-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "Piper $GITHUB_REF_NAME" --notes "$notes" $(find dist -type f)
