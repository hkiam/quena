name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the runners' preinstalled 1.98.1 cannot link wasm32 components on
  # macOS (rust-lld: libLLVM.dylib not found). Keep in sync with local stable.
  RUST_TOOLCHAIN: "1.96.0"
  QUENA_WASM_TOOLCHAIN: "1.96.0"
  # Debug-build perf guards run on slow shared VMs: widen their time thresholds.
  QUENA_PERF_SLACK: "3"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu so the .deb/AppImage run on older glibc.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm \
            libnss3-tools libsecret-tools libgssapi-krb5-2 dbus dbus-x11 gsettings-desktop-schemas dconf-cli
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/fast-infoset
            plugins/rot13-test
            plugins/evil-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Version consistency
        shell: bash
        run: |
          tools/release/version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          fi

      - name: UI dependencies
        run: npm ci --prefix app/ui
      - name: UI typecheck + build
        run: npm run build --prefix app/ui
      - name: Plugins
        shell: bash
        run: ./plugins/build.sh
      - name: Rust tests
        run: cargo test --workspace --exclude quena-app --no-fail-fast
      - name: Linux desktop integration (GNOME proxy settings, NSS trust)
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test -p quena-platform -- --ignored

      # Platform-independent checks: run once.
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: 21
      - name: Fast Infoset interop (Java reference)
        if: runner.os == 'macOS'
        shell: bash
        run: ./plugins/fast-infoset/interop/run.sh
      - name: License check
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      - name: Bundle
        env:
          # AppImage tools run without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm exec --prefix app/ui -- tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: quena-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "Quena $GITHUB_REF_NAME" --notes "$notes" $(find dist -type f)
