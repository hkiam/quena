name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the runners' preinstalled 1.98.1 cannot link wasm32 components on
  # macOS (rust-lld: libLLVM.dylib not found). Keep in sync with local stable.
  RUST_TOOLCHAIN: "1.96.0"
  QUENA_WASM_TOOLCHAIN: "1.96.0"
  # Debug-build perf guards run on slow shared VMs: widen their time thresholds.
  QUENA_PERF_SLACK: "3"
  # Full optimization (LTO, one codegen unit) only for release tags; pushes build test
  # installers with the faster `ci` profile.
  BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu so the .deb/AppImage run on older glibc.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm \
            libnss3-tools libsecret-tools libgssapi-krb5-2 dbus dbus-x11 gsettings-desktop-schemas dconf-cli
      - name: Windows Defender exclusions (build dirs)
        if: runner.os == 'Windows'
        shell: pwsh
        # Real-time scanning of every object file and rlib slows Rust builds considerably.
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:RUNNER_TEMP"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/fast-infoset
            plugins/rot13-test
            plugins/evil-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Version consistency
        shell: bash
        run: |
          tools/release/version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          fi

      - name: UI dependencies
        run: npm ci --prefix app/ui
      - name: UI typecheck + build
        run: npm run build --prefix app/ui
      - name: UI tests
        run: npm test --prefix app/ui
      - name: Plugins
        shell: bash
        run: ./plugins/build.sh
      - name: Plugin tests
        shell: bash
        run: cargo test --manifest-path plugins/auth-tokens/Cargo.toml
      - name: Rust tests
        run: cargo test --workspace --exclude quena-app --no-fail-fast
      - name: Linux desktop integration (GNOME proxy settings, NSS trust)
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test -p quena-platform -- --ignored

      # Platform-independent checks: run once.
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: 21
      - name: Fast Infoset interop (Java reference)
        if: runner.os == 'macOS'
        shell: bash
        run: ./plugins/fast-infoset/interop/run.sh
      - name: License check
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      - name: Bundle
        env:
          # AppImage tools run without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          if [ "$BUILD_PROFILE" = release ]; then
            npm exec --prefix app/ui -- tauri build
          else
            npm exec --prefix app/ui -- tauri build -- --profile "$BUILD_PROFILE"
          fi
      - name: Portable ZIP (Windows, xcopy deployment)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $out = "target/$env:BUILD_PROFILE/bundle/portable"
          $dir = "$out/Quena"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/$env:BUILD_PROFILE/quena.exe" "$dir/Quena.exe"
          # Same resources as the installers (bundled plugins).
          foreach ($r in $conf.bundle.resources.PSObject.Properties) {
            $src = Join-Path app/src-tauri $r.Name
            $dst = Join-Path $dir $r.Value
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            Copy-Item -Recurse $src $dst
          }
          New-Item -ItemType File "$dir/portable" | Out-Null
          Copy-Item app/src-tauri/windows/PORTABLE.txt "$dir/README-portable.txt"
          Copy-Item LICENSE, NOTICE $dir
          Compress-Archive -Path $dir -DestinationPath "$out/Quena_$($conf.version)_x64-portable.zip" -Force
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: quena-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/${{ env.BUILD_PROFILE }}/bundle/dmg/*.dmg
            target/${{ env.BUILD_PROFILE }}/bundle/nsis/*.exe
            target/${{ env.BUILD_PROFILE }}/bundle/msi/*.msi
            target/${{ env.BUILD_PROFILE }}/bundle/portable/*.zip
            target/${{ env.BUILD_PROFILE }}/bundle/deb/*.deb
            target/${{ env.BUILD_PROFILE }}/bundle/rpm/*.rpm
            target/${{ env.BUILD_PROFILE }}/bundle/appimage/*.AppImage

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "Quena $GITHUB_REF_NAME" --notes "$notes" $(find dist -type f)
