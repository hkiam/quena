name: Quena diagnostics
description: Analyse HAR/SAZ captures with Quena, compare them with a baseline and fail the build on regressions.
author: Maik Hofmann
branding:
  icon: activity
  color: blue
inputs:
  files:
    description: Captures to analyse (.har, .saz), separated by spaces or new lines; glob patterns are expanded.
    required: true
  profile:
    description: Analysis profile (full, performance, troubleshooting, auth, resilience, modernization).
    default: full
  lang:
    description: Language of the report (en, de).
    default: en
  baseline:
    description: Baseline report (JSON of an earlier run); only new or worse findings break the gate.
    default: ""
  fail-on:
    description: Fail on findings of this severity or worse (critical, warning, info, none).
    default: critical
  budgets:
    description: Metric budgets, e.g. "requests=+10% bytes=+20% errors=0".
    default: ""
  ignore:
    description: Rules or finding keys that never break the gate, separated by new lines.
    default: ""
  config:
    description: Settings file (JSON) with failOn, budgets, ignore, profile, options …
    default: ""
  args:
    description: Further arguments for quena-cli diagnose.
    default: ""
  version:
    description: quena-cli release to use (e.g. 0.2.0) or "latest"; default is the release the action is used from (hkiam/quena/diagnose@v0.2.0), otherwise the latest.
    default: ""
  bin:
    description: Path to an existing quena-cli instead of downloading one.
    default: ""
  summary:
    description: Write the report to the job summary.
    default: "true"
outputs:
  passed:
    description: '"true" when the quality gate passed.'
    value: ${{ steps.run.outputs.passed }}
  report:
    description: Path of the JSON report (use it as the next baseline).
    value: ${{ steps.run.outputs.report }}
  junit:
    description: Path of the JUnit XML.
    value: ${{ steps.run.outputs.junit }}
  markdown:
    description: Path of the Markdown report.
    value: ${{ steps.run.outputs.markdown }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        BIN: ${{ inputs.bin }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ -n "$BIN" ]; then echo "exe=$BIN" >> "$GITHUB_OUTPUT"; exit 0; fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64; ext=tar.gz ;;
          Linux-ARM64) platform=linux-arm64; ext=tar.gz ;;
          macOS-*) platform=macos-universal; ext=tar.gz ;;
          Windows-X64) platform=windows-x64; ext=zip ;;
          *) echo "::error::quena-cli is not available for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
        esac
        if [ -z "$VERSION" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="$ACTION_REF"; else VERSION=latest; fi
        fi
        tag=""; [ "$VERSION" != latest ] && tag="v${VERSION#v}"
        dir="$RUNNER_TEMP/quena-cli"; mkdir -p "$dir"
        gh release download $tag --repo hkiam/quena --pattern "quena-cli-*-$platform.$ext" --dir "$dir" --clobber
        cd "$dir"
        if [ "$ext" = zip ]; then unzip -q -o quena-cli-*.zip; else tar -xzf quena-cli-*.tar.gz; fi
        exe=$(find "$dir" -type f \( -name quena-cli -o -name quena-cli.exe \) | head -n1)
        echo "exe=$exe" >> "$GITHUB_OUTPUT"
    - id: run
      shell: bash
      env:
        EXE: ${{ steps.install.outputs.exe }}
        FILES: ${{ inputs.files }}
        PROFILE: ${{ inputs.profile }}
        LANG_: ${{ inputs.lang }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON: ${{ inputs.fail-on }}
        BUDGETS: ${{ inputs.budgets }}
        IGNORE: ${{ inputs.ignore }}
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/quena-report"; mkdir -p "$out"
        args=(diagnose)
        shopt -s nullglob globstar
        for f in $FILES; do args+=("$f"); done
        [ ${#args[@]} -gt 1 ] || { echo "::error::no capture matches: $FILES"; exit 2; }
        args+=(--profile "$PROFILE" --lang "$LANG_" --fail-on "$FAIL_ON")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        for b in $BUDGETS; do args+=(--budget "$b"); done
        while IFS= read -r i; do [ -n "$i" ] && args+=(--ignore "$i"); done <<< "$IGNORE"
        args+=(--format github -o "json=$out/report.json" -o "junit=$out/junit.xml" -o "md=$out/report.md")
        # shellcheck disable=SC2086
        "$EXE" "${args[@]}" $ARGS
        rc=$?
        echo "report=$out/report.json" >> "$GITHUB_OUTPUT"
        echo "junit=$out/junit.xml" >> "$GITHUB_OUTPUT"
        echo "markdown=$out/report.md" >> "$GITHUB_OUTPUT"
        echo "passed=$([ $rc = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [ "$SUMMARY" = true ] && [ -f "$out/report.md" ]; then cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $rc
