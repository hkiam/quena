[package]
name = "piper-proxy"
description = "Piper capture engine: HTTP/1.1 + HTTP/2 forward proxy with HTTPS interception"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
piper-model.workspace = true
piper-body.workspace = true
piper-store.workspace = true
piper-tls.workspace = true
piper-platform.workspace = true
piper-query.workspace = true
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "server-auto", "tokio", "http1", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower-service = "0.3"
crossbeam-channel.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
hyper-util = { version = "0.1", features = ["server-auto"] }
http-body-util = { version = "0.1", features = ["channel"] }
