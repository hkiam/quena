[package]
name = "quena-app-core"
description = "Application facade for the UI: commands, events, ticker, settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quena-model.workspace = true
quena-body.workspace = true
quena-jobs.workspace = true
quena-index.workspace = true
quena-query.workspace = true
quena-store.workspace = true
quena-proxy.workspace = true
quena-formats.workspace = true
quena-plugin-host.workspace = true
quena-auth.workspace = true
quena-script.workspace = true
quena-tls.workspace = true
quena-platform.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
dirs.workspace = true
time.workspace = true
flate2.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
toml_edit = "0.25"
tokio.workspace = true
quick-xml = "0.38"
serde_json_path = "0.7"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Protobuf with schemas (.proto files, gRPC server reflection) and MessagePack bodies.
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
protox = { version = "0.10", default-features = false }
rmpv = "1"
base64 = "0.22"
http = "1"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1", "http2"] }
http-body = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
brotli.workspace = true
tempfile.workspace = true
