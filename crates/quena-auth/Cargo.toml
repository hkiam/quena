[package]
name = "quena-auth"
description = "Automatic authentication: challenge parsing, Basic, NTLMv2, Negotiate (SPNEGO)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# GSS.framework is linked directly; no crate needed.

[target.'cfg(target_os = "linux")'.dependencies]
# libgssapi (MIT/Heimdal) is dlopen'd at runtime; no build-time Kerberos dependency.
libloading = "0.8"
