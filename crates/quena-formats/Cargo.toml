[package]
name = "quena-formats"
description = "Session archive formats: Fiddler SAZ, HAR 1.2, cURL, .http request collections"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quena-model.workspace = true
quena-body.workspace = true
quena-store.workspace = true
zip = { version = "8", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
flate2.workspace = true
quick-xml = "0.38"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
time.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
etherparse = "0.21"
fluke-hpack = "0.3"
http = "1"
ring = "0.17"
aes = "0.9"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tempfile.workspace = true
